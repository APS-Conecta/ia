<title>Prototipo de «IA»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* PROTOTYPE, throwaway. Hybrid layout chosen 2026-11-19: menu by section, everyone starts on «Para ti», editors also get «Documentos».
   Mirrors Nextcloud 34 + @nextcloud/vue 9 (NcContent > NcAppNavigation > NcAppContent > NcAppSidebar) with the APS Conecta theme. Example data; nothing is saved. */
/* Layout: Nextcloud shell = violet ground, 50px header, 12px-rounded white container. Light only (enforce_theme=light). Tokens follow Nextcloud's own variable names. */
:root{
  --color-background-plain:#5315a8; --color-main-background:#ffffff; --color-main-text:#101828; --color-text-maxcontrast:#485363;
  --color-background-hover:#f5f5f5; --color-background-dark:#ededed; --color-background-darker:#dbdbdb;
  --color-border:#ededed; --color-border-dark:#dbdbdb; --color-border-maxcontrast:#7d7d7d;
  --color-primary-element:#7f21fe; --color-primary-element-hover:#6d12e8; --color-primary-element-text:#ffffff;
  --color-primary-element-light:#f0e6ff; --color-primary-element-light-hover:#e5d4ff; --color-primary-element-light-text:#4a109c;
  --color-error:#ea003e; --color-text-error:#b4002f; --color-error-bg:#fdeaf0;
  --color-warning:#e06f00; --color-warning-text:#9a4c00; --color-warning-bg:#fff3e6;
  --color-success:#2d7b41; --color-success-text:#1f6a34; --color-success-bg:#e8f4ec;
  --color-info:#0071ad; --color-info-text:#005b8c; --color-info-bg:#e6f1f7;
  --color-box-shadow:rgba(16,24,40,.22); --color-header-text:#ffffff;
  --border-radius-element:8px; --border-radius-large:10px; --border-radius-container:12px; --border-radius-container-large:16px; --border-radius-pill:100px;
  --default-clickable-area:34px; --default-grid-baseline:4px; --header-height:50px; --app-navigation-width:300px; --sidebar-width:400px;
  --font-face:"Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display:"Fraunces", Georgia, "Times New Roman", serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--color-background-plain);color:var(--color-main-text);font-family:var(--font-face);font-size:15px;line-height:1.5;display:flex;flex-direction:column;box-sizing:border-box;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 70px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-primary-element);outline-offset:2px}
.mdi{display:inline-flex;flex:none;align-items:center;justify-content:center}
.mdi svg{display:block;fill:currentColor}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:20px} h3{font-size:16px}
.muted{color:var(--color-text-maxcontrast)} .small{font-size:13px} .bold{font-weight:700}
.tab-num{font-variant-numeric:tabular-nums}

/* Header (NC 34 + side_menu + suite short name) */
#header{flex:0 0 var(--header-height);height:var(--header-height);display:flex;align-items:center;gap:4px;color:var(--color-header-text);min-width:0;position:relative;z-index:20}
.header-btn{background:transparent;border:0;color:var(--color-header-text);height:40px;min-width:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border-radius:var(--border-radius-pill);cursor:pointer}
.header-btn:hover,.header-btn[aria-expanded=true]{background:rgba(255,255,255,.16)}
.logo{font-family:var(--font-display);font-weight:600;font-size:19px;white-space:nowrap;padding:0 8px 0 4px}
.estab{font-family:var(--font-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-left:10px;border-left:1px solid rgba(255,255,255,.35)}
.header-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.header-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--color-warning);box-shadow:0 0 0 2px var(--color-background-plain)}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:#fff;color:var(--color-background-plain)}

/* Popovers (NcPopover / NcActions menu) */
.popover{position:absolute;background:var(--color-main-background);color:var(--color-main-text);border-radius:var(--border-radius-large);box-shadow:0 2px 14px var(--color-box-shadow);z-index:40;padding:4px;min-width:220px}
.pop-anchor{position:relative;display:inline-flex}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--default-clickable-area);padding:0 12px 0 8px;border:0;background:none;border-radius:var(--border-radius-element);cursor:pointer;text-align:left;white-space:nowrap}
.menu-item:hover{background:var(--color-background-hover)}
.menu-item.error{color:var(--color-text-error)}
.menu-sep{height:1px;background:var(--color-border);margin:4px 0}
.notif-panel{right:0;top:46px;width:min(380px, calc(100vw - 32px));padding:0;overflow:hidden}
.notif-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--color-border)}
.notif{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--color-border)}
.notif:last-child{border-bottom:0}
.notif .mdi{color:var(--color-text-maxcontrast);margin-top:2px}
.apps-panel{left:0;top:46px;width:min(420px, calc(100vw - 32px));padding:10px}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:4px}
.app-tile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border:0;background:none;border-radius:var(--border-radius-large);cursor:pointer;text-align:center;font-size:14px}
.app-tile:hover{background:var(--color-background-hover)}
.app-tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--color-primary-element-light);color:var(--color-primary-element-light-text)}
.app-tile.current .ic{background:var(--color-primary-element);color:#fff}

/* Container */
#content{flex:1;min-height:0;display:flex;background:var(--color-main-background);border-radius:var(--border-radius-container);overflow:hidden;position:relative;margin-bottom:8px}

/* NcAppNavigation */
.app-navigation{flex:0 0 var(--app-navigation-width);width:var(--app-navigation-width);box-sizing:border-box;border-right:1px solid var(--color-border);display:flex;flex-direction:column;background:var(--color-main-background);overflow:hidden}
.app-navigation.collapsed{display:none}
.nav-list{flex:1;overflow:auto;padding:var(--default-grid-baseline);display:flex;flex-direction:column;gap:2px}
.nav-new{padding:8px 8px 4px}
.nav-new .button{width:100%}
.nav-entry{display:flex;align-items:center;min-height:var(--default-clickable-area);border-radius:var(--border-radius-element);border:0;background:none;cursor:pointer;width:100%;padding:0 8px 0 0;text-align:left;color:var(--color-main-text)}
.nav-entry:hover{background:var(--color-background-hover)}
.nav-entry .mdi{width:var(--default-clickable-area);height:var(--default-clickable-area)}
.nav-entry .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-entry.active{background:var(--color-primary-element);color:var(--color-primary-element-text)}
.nav-entry.active:hover{background:var(--color-primary-element-hover)}
.nav-entry.sub{padding-left:22px;min-height:32px;font-size:14px}
.nav-entry.sub:not(:has(.mdi:first-child)){padding-left:34px}
.nav-caption{font-weight:700;font-size:14px;color:var(--color-text-maxcontrast);padding:12px 10px 2px}
.counter{min-width:18px;height:20px;padding:0 6px;border-radius:var(--border-radius-pill);display:inline-grid;place-items:center;font-size:12px;font-weight:800;background:var(--color-primary-element-light);color:var(--color-primary-element-light-text);box-sizing:border-box}
.nav-entry.active .counter{background:var(--color-primary-element-text);color:var(--color-primary-element)}
.counter.highlighted{background:var(--color-primary-element);color:#fff}
.nav-footer{padding:var(--default-grid-baseline);border-top:1px solid var(--color-border)}

/* NcAppContent */
.app-content{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column;position:relative}
.content-bar{position:sticky;top:0;z-index:4;background:var(--color-main-background);display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 16px 6px 8px;box-sizing:border-box;border-bottom:1px solid var(--color-border);flex-wrap:wrap}
.content-bar .titles{flex:1;min-width:180px;padding-left:2px}
.content-bar h2{font-size:19px}
.content-bar .sub{font-size:13px;color:var(--color-text-maxcontrast)}
.content-bar .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.page{padding:20px 24px 48px;display:flex;flex-direction:column;gap:26px;max-width:900px;width:100%;box-sizing:border-box}
.page.wide{max-width:none}
.section{display:flex;flex-direction:column;gap:8px;min-width:0}
.section-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.prose{max-width:68ch;margin:0}

/* NcButton */
.button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--default-clickable-area);padding:0 14px;border-radius:var(--border-radius-element);border:0;font-weight:700;cursor:pointer;white-space:nowrap;box-sizing:border-box}
.button.has-icon{padding-left:8px}
.button.icon-only{width:var(--default-clickable-area);padding:0}
.button .mdi svg{width:20px;height:20px}
.button.primary{background:var(--color-primary-element);color:var(--color-primary-element-text)}
.button.primary:hover{background:var(--color-primary-element-hover)}
.button.secondary{background:var(--color-primary-element-light);color:var(--color-primary-element-light-text)}
.button.secondary:hover{background:var(--color-primary-element-light-hover)}
.button.tertiary{background:transparent;color:var(--color-main-text)}
.button.tertiary:hover{background:var(--color-background-hover)}
.button.small{min-height:28px;font-size:14px;padding:0 10px}

/* NcListItem */
.list{display:flex;flex-direction:column;gap:2px}
.list-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--border-radius-element);min-height:56px;box-sizing:border-box;position:relative}
.list-item.clickable{cursor:pointer}
.list-item.clickable:hover{background:var(--color-background-hover)}
.list-item .lead{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--color-background-dark);color:var(--color-main-text)}
.list-item .lead.primary{background:var(--color-primary-element-light);color:var(--color-primary-element-light-text)}
.list-item .lead.warning{background:var(--color-warning-bg);color:var(--color-warning-text)}
.list-item .lead.error{background:var(--color-error-bg);color:var(--color-text-error)}
.list-item .lead.success{background:var(--color-success-bg);color:var(--color-success-text)}
.list-item .body{flex:1;min-width:0}
.list-item .line-one{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.list-item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.list-item .details{font-size:13px;color:var(--color-text-maxcontrast);white-space:nowrap;flex:none}
.list-item .subname{font-size:14px;color:var(--color-text-maxcontrast);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item .extra{font-size:14px;margin-top:2px}
.list-item .tail{display:flex;gap:4px;align-items:center;flex:none}
.list-item.wrap .name,.list-item.wrap .subname{white-space:normal}
.list-item.status-row{background:var(--color-primary-element-light)}

/* NcChip, NcNoteCard, NcEmptyContent, NcLoadingIcon */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--border-radius-pill);font-size:13px;font-weight:700;background:var(--color-background-dark);color:var(--color-main-text);white-space:nowrap;box-sizing:border-box}
.chip .mdi svg{width:16px;height:16px}
.chip.primary{background:var(--color-primary-element-light);color:var(--color-primary-element-light-text)}
.chip.warning{background:var(--color-warning-bg);color:var(--color-warning-text)}
.chip.error{background:var(--color-error-bg);color:var(--color-text-error)}
.chip.success{background:var(--color-success-bg);color:var(--color-success-text)}
.note-card{display:flex;gap:12px;padding:12px 14px;border-radius:var(--border-radius-large);border-left:4px solid var(--note);background:var(--note-bg);--note:var(--color-info);--note-bg:var(--color-info-bg);--note-text:var(--color-info-text)}
.note-card > .mdi{color:var(--note-text)}
.note-card.warning{--note:var(--color-warning);--note-bg:var(--color-warning-bg);--note-text:var(--color-warning-text)}
.note-card.error{--note:var(--color-error);--note-bg:var(--color-error-bg);--note-text:var(--color-text-error)}
.note-card.success{--note:var(--color-success);--note-bg:var(--color-success-bg);--note-text:var(--color-success-text)}
.note-card .body{flex:1;min-width:0;font-size:14px}
.note-card .title{font-weight:800}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:48px 16px;color:var(--color-text-maxcontrast)}
.empty > .mdi svg{width:64px;height:64px;opacity:.5}
.empty h2{color:var(--color-main-text)}
.loading{width:20px;height:20px;border-radius:50%;border:2px solid var(--color-primary-element-light-hover);border-top-color:var(--color-primary-element);animation:spin .9s linear infinite;flex:none;box-sizing:border-box}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.loading{animation:none}}

/* Edition */
.edition-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--color-text-maxcontrast)}
.foryou{border-radius:var(--border-radius-container);background:var(--color-primary-element-light);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.foryou h3{color:var(--color-primary-element-light-text)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.col h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-text-maxcontrast)}
.foryou .col h4{color:var(--color-primary-element-light-text)}
.col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.col li{font-size:14px}
.when{font-weight:800;font-variant-numeric:tabular-nums;display:block}
.linklike{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-weight:700;color:inherit;text-decoration:underline;text-decoration-color:var(--color-border-maxcontrast);text-underline-offset:3px}
.finding{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--color-border)}
.finding:last-child{border-bottom:0}
.suggestion{display:flex;gap:8px;align-items:flex-start;background:var(--color-background-hover);border-radius:var(--border-radius-element);padding:8px 10px;font-size:14px}
.suggestion .mdi{color:var(--color-success-text);margin-top:1px}

/* Table (Files-like) */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th{text-align:left;font-weight:600;color:var(--color-text-maxcontrast);padding:0 10px;height:44px;border-bottom:1px solid var(--color-border);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--color-border);vertical-align:middle;height:34px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--color-background-hover)}
tr.row.selected td{background:var(--color-primary-element-light)}
.file-name{display:flex;align-items:center;gap:10px;min-width:0}
.file-ic{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:6px}
.file-ic.pdf{color:#c8001e} .file-ic.doc,.file-ic.odt{color:#2a5699} .file-ic.xls{color:#1d6f42} .file-ic.folder{color:var(--color-primary-element)}
.segmented{display:inline-flex;flex-wrap:wrap;gap:4px}
.segmented button{border:0;background:var(--color-background-hover);border-radius:var(--border-radius-element);min-height:30px;padding:0 12px;font-weight:700;font-size:14px;cursor:pointer}
.segmented button[aria-pressed=true]{background:var(--color-primary-element-light);color:var(--color-primary-element-light-text)}

/* NcAppSidebar */
.app-sidebar{flex:0 0 var(--sidebar-width);width:var(--sidebar-width);box-sizing:border-box;border-left:1px solid var(--color-border);overflow:auto;background:var(--color-main-background);display:flex;flex-direction:column}
.sidebar-header{display:flex;gap:4px;align-items:flex-start;padding:14px 10px 10px 16px}
.sidebar-header .titles{flex:1;min-width:0}
.sidebar-header h2{font-size:19px;overflow-wrap:anywhere}
.sidebar-tabs{display:flex;gap:4px;padding:0 10px 8px;border-bottom:1px solid var(--color-border);overflow-x:auto}
.sidebar-tab{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:var(--border-radius-element);padding:6px 8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--color-text-maxcontrast)}
.sidebar-tab:hover{background:var(--color-background-hover)}
.sidebar-tab[aria-selected=true]{background:var(--color-primary-element-light);color:var(--color-primary-element-light-text)}
.sidebar-body{padding:16px;display:flex;flex-direction:column;gap:18px}
.sidebar-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--color-border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* Forms (NcTextField, NcSelect, NcCheckboxRadioSwitch) */
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-weight:700;font-size:14px}
.hint{font-size:13px;color:var(--color-text-maxcontrast)}
.input,.select,.textarea{width:100%;box-sizing:border-box;min-height:var(--default-clickable-area);border:2px solid var(--color-border-maxcontrast);border-radius:var(--border-radius-element);padding:4px 10px;background:var(--color-main-background);color:var(--color-main-text)}
.textarea{min-height:84px;resize:vertical;padding:8px 10px}
.input:hover,.select:hover,.textarea:hover{border-color:var(--color-primary-element)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--color-primary-element);outline:none;box-shadow:0 0 0 2px var(--color-primary-element-light)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline .input{width:auto}
.radio{display:flex;gap:6px;align-items:flex-start;border:0;background:none;padding:4px 6px;border-radius:var(--border-radius-element);cursor:pointer;text-align:left;width:100%}
.radio:hover{background:var(--color-background-hover)}
.radio .mdi{color:var(--color-primary-element)}
.radio .lbl{padding-top:2px}
.source-row{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px 0 8px;border-radius:var(--border-radius-element)}
.source-row:hover{background:var(--color-background-hover)}
.source-row .grow{flex:1;min-width:0;overflow-wrap:anywhere}

/* Dialog (NcDialog / FilePicker) */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--color-main-background);border-radius:var(--border-radius-container-large);width:min(760px,100%);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.dialog-head{display:flex;align-items:center;gap:10px;padding:14px 12px 10px 20px}
.dialog-head h2{flex:1}
.dialog-main{display:flex;min-height:0;flex:1}
.dialog-nav{flex:0 0 190px;padding:4px 8px;border-right:1px solid var(--color-border)}
.dialog-content{flex:1;min-width:0;overflow:auto;padding:0 12px 12px}
.breadcrumbs{display:flex;align-items:center;gap:2px;min-height:44px;flex-wrap:wrap;font-weight:700}
.breadcrumbs .crumb{border:0;background:none;padding:4px 8px;border-radius:var(--border-radius-element);cursor:pointer;display:inline-flex;align-items:center}
.breadcrumbs .crumb:hover{background:var(--color-background-hover)}
.breadcrumbs .sep{color:var(--color-text-maxcontrast)}
.dialog-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--color-border)}

/* Settings (NcSettingsSection) */
.settings-section{padding:24px 28px;border-bottom:1px solid var(--color-border);display:flex;flex-direction:column;gap:12px;max-width:900px}
.settings-section:last-child{border-bottom:0}
.settings-section > .desc{color:var(--color-text-maxcontrast);margin:0;max-width:72ch;font-size:14px}
.kv{display:grid;grid-template-columns:minmax(170px,auto) 1fr;gap:6px 18px;font-size:14px;margin:0}
.kv dt{color:var(--color-text-maxcontrast)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--color-success);flex:none}
.flow-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.flow-card{border:2px solid var(--color-border);border-radius:var(--border-radius-large);padding:14px;display:flex;flex-direction:column;gap:6px}
.flow-card.ours{border-color:var(--color-primary-element)}
.flow-card > .mdi{color:var(--color-primary-element);justify-content:flex-start}
.flow-rule{border:1px solid var(--color-border-dark);border-radius:var(--border-radius-large);padding:14px 16px;display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px;max-width:640px;margin:0}
.flow-rule dt{font-weight:800;color:var(--color-text-maxcontrast)}
.flow-rule dd{margin:0}

/* Dashboard */
.dash{padding:28px 24px 48px;display:flex;flex-direction:column;align-items:center;gap:22px;overflow:auto;flex:1}
.dash h1{font-size:30px;text-align:center}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,320px));gap:16px;justify-content:center;width:100%}
.widget{background:var(--color-main-background);border-radius:var(--border-radius-container-large);padding:14px 10px 10px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--color-border);min-width:0}
.widget-title{display:flex;align-items:center;gap:8px;font-weight:800;padding:0 8px 6px;font-size:16px}
.widget .list-item{min-height:48px}
.widget-foot{display:flex;justify-content:center;padding-top:6px}

/* Prototype bar: not part of the design */
.protobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom, 0px));z-index:60;background:#101828;color:#fff;border-radius:16px;padding:6px 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;box-shadow:0 10px 28px rgba(0,0,0,.45);width:max-content;max-width:calc(100% - 32px);font-size:13px;box-sizing:border-box}
.pb-tag{background:var(--color-warning);color:#101828;font-weight:800;border-radius:var(--border-radius-pill);padding:2px 10px;white-space:nowrap}
.pb-seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:var(--border-radius-pill);padding:2px;flex-wrap:wrap}
.pb-seg button{background:none;border:0;color:#fff;padding:3px 10px;border-radius:var(--border-radius-pill);cursor:pointer;font-weight:700}
.pb-seg button[aria-pressed=true]{background:#fff;color:#101828}
.toast{position:fixed;top:calc(56px + env(safe-area-inset-top, 0px));right:max(24px, env(safe-area-inset-right, 0px));background:#101828;color:#fff;padding:10px 14px;border-radius:var(--border-radius-large);z-index:70;max-width:min(380px, calc(100vw - 48px));font-size:14px;box-shadow:0 8px 24px rgba(16,24,40,.3);display:flex;gap:12px;align-items:center}

@media (max-width: 1180px){
  .app-sidebar{position:absolute;top:0;right:0;bottom:0;width:min(var(--sidebar-width),100%);box-shadow:-10px 0 28px rgba(16,24,40,.2);z-index:8}
}
@media (max-width: 800px){
  html,body{height:auto}
  body{display:block;padding-block:0 120px}
  #content{min-height:calc(100vh - 140px);flex-direction:column;overflow:visible}
  .app-navigation{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--color-border)}
  .app-navigation:not(.open){display:none}
  .content-bar{position:static;padding:6px 10px}
  .page{padding:16px 16px 40px}
  .estab,.hide-sm{display:none}
  .app-sidebar{position:fixed;inset:0;width:auto;z-index:45;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
  .kv,.flow-rule{grid-template-columns:1fr}
  .dialog-nav{display:none}
  .settings-section{padding:18px 16px}
}
</style>

const S = { screen: 'ia', view: { s: 'parati' }, role: 'editora', side: null, tab: null, pop: null, modal: null, navOpen: false, navCollapsed: false,
  pending: null, done: [], correcting: null, corrected: {}, withdrawn: {}, retried: {}, read: {}, filter: 'all', settings: 'ia', sched: {} };

const P = () => PEOPLE[S.role];
const isEditor = () => S.role !== 'lectora';
const isAdmin = () => S.role === 'admin';
const receives = (b) => b.readers.includes('Todo el personal') || b.readers.some((g) => P().groups.includes(g));
const canManage = (b) => isEditor() && P().groups.includes(b.group);
const visibleBulletins = () => BULLETINS.filter((b) => receives(b) || canManage(b));
const bOf = (id) => BULLETINS.find((b) => b.id === id);
const docOk = (id) => !(DOCS[id].restricted && S.role === 'lectora');
const forCargo = (d) => d.cargos.includes(P().cargo) || d.cargos.includes('Todos los cargos');
const myActions = () => Object.entries(ACTIONS).filter(([, a]) => isEditor() && (P().groups.includes(a.group) || a.origin === 'flow'));
const canEditAction = (a) => a.origin === 'ia' && P().groups.includes(a.group);
const fileIcon = (t) => t === 'pdf' ? 'mdiFilePdfBox' : t === 'xls' ? 'mdiFileExcelBox' : 'mdiFileWordBox';
const kindChip = (k) => `<span class="chip ${k === 'Error' ? 'error' : k === 'Falta' ? 'warning' : 'primary'}">${k}</span>`;
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

/* ---------- component helpers, named after @nextcloud/vue ---------- */
const NcButton = (type, label, act, icon = '', aria = '') => `<button class="button ${type} ${icon ? 'has-icon' : ''} ${label ? '' : 'icon-only'}" data-act="${act}" ${label ? '' : `aria-label="${aria}" title="${aria}"`}>${icon ? ic(icon) : ''}${label ? `<span>${label}</span>` : ''}</button>`;
function NcActions(key, items, label = 'Acciones') {
  const open = S.pop === 'act:' + key;
  return `<span class="pop-anchor" data-keep>${NcButton('tertiary', '', 'pop:act:' + key, 'mdiDotsHorizontal', label)}
    ${open ? `<div class="popover" role="menu" style="right:0;top:38px">${items.map((it) => it === '-' ? '<div class="menu-sep"></div>' :
      `<button class="menu-item ${it.error ? 'error' : ''}" role="menuitem" data-act="${it.act}">${ic(it.icon)}<span>${it.label}</span></button>`).join('')}</div>` : ''}</span>`;
}
const NcChip = (text, type = '', icon = '') => `<span class="chip ${type}">${icon ? ic(icon, 16) : ''}${text}</span>`;
const NOTE_ICON = { warning: 'mdiAlertOutline', error: 'mdiAlertCircleOutline', success: 'mdiCheckCircleOutline', info: 'mdiInformationOutline' };
const NcNoteCard = (type, html, title = '') => `<div class="note-card ${type}" role="note">${ic(NOTE_ICON[type])}<div class="body">${title ? `<div class="title">${title}</div>` : ''}${html}</div></div>`;
function NcListItem({ icon, lead = '', name, sub = '', details = '', extra = '', act = '', tail = '', wrap = false, cls = '' }) {
  return `<div class="list-item ${act ? 'clickable' : ''} ${wrap ? 'wrap' : ''} ${cls}" ${act ? `data-act="${act}" role="button" tabindex="0"` : ''}>
    <span class="lead ${lead}">${ic(icon)}</span><div class="body"><div class="line-one"><span class="name">${name}</span>${details ? `<span class="details">${details}</span>` : ''}</div>
    ${sub ? `<div class="subname">${sub}</div>` : ''}${extra ? `<div class="extra">${extra}</div>` : ''}</div>${tail ? `<div class="tail" data-keep>${tail}</div>` : ''}</div>`;
}
const navEntry = (act, name, icon, active, counter = '', cls = '') =>
  `<button class="nav-entry ${cls} ${active ? 'active' : ''}" data-act="${act}" ${active ? 'aria-current="page"' : ''}>${icon ? ic(icon) : ''}<span class="name">${name}</span>${counter}</button>`;
const contentBar = (title, sub = '', acts = '', back = '') => `<div class="content-bar">${NcButton('tertiary', '', 'toggle-nav', 'mdiMenu', 'Abrir o cerrar la navegación')}${back}
    <div class="titles"><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="acts">${acts}</div></div>`;
const backBtn = (act) => NcButton('tertiary', '', act, 'mdiArrowLeft', 'Volver');

/* ---------- «IA»: navigation ---------- */
function iaNavigation() {
  const v = S.view;
  const unread = (b) => receives(b) && !S.read[b.editions[0]];
  return `<nav class="app-navigation ${S.navCollapsed ? 'collapsed' : ''} ${S.navOpen ? 'open' : ''}" aria-label="«IA»">
    <div class="nav-new">${NcButton('primary', 'Revisar un documento', 'open-picker:doc', 'mdiPlus')}</div>
    <div class="nav-list">
      ${navEntry('view:parati', 'Para ti', 'mdiStarOutline', v.s === 'parati')}
      ${navEntry('view:bulletins', 'Boletines', 'mdiNewspaperVariantOutline', v.s === 'bulletins')}
      ${visibleBulletins().map((b) => navEntry('edition:' + b.editions[0], b.name, '', v.s === 'edition' && EDITIONS[v.e].b === b.id,
        unread(b) ? '<span class="counter highlighted" title="Edición sin leer">1</span>' : b.writing && canManage(b) ? `<span title="Escribiendo la próxima edición">${ic('mdiTimerSand', 18)}</span>` : '', 'sub')).join('')}
      ${navEntry('view:reviews', 'Revisiones', 'mdiFileDocumentCheckOutline', v.s === 'reviews' || v.s === 'report', S.pending ? '<span class="loading" title="Revisión en curso"></span>' : '')}
      ${isEditor() ? `<div class="nav-caption">Para editores</div>
        ${navEntry('view:docs', 'Documentos', 'mdiFileDocumentMultipleOutline', v.s === 'docs', `<span class="counter">${Object.keys(DOCS).filter(docOk).length}</span>`)}
        ${navEntry('view:actions', 'Acciones automáticas', 'mdiLightningBoltOutline', v.s === 'actions', `<span class="counter">${myActions().length}</span>`)}` : ''}
    </div>
    <div class="nav-footer">${isAdmin() ? navEntry('goto:settings:ia', 'Estado y ajustes (administración)', 'mdiPulse', false) : ''}${navEntry('toast:Ajustes personales de «IA»: qué avisos recibes por boletines y revisiones.', 'Ajustes de «IA»', 'mdiCogOutline', false)}</div>
  </nav>`;
}

/* ---------- «IA»: pages ---------- */
function personalCols(docIds, inEdition) {
  const pt = PARATI[S.role];
  const docs = docIds.filter((id) => docOk(id) && forCargo(DOCS[id]));
  const li = (w, t) => `<li><span class="when">${w}</span>${t}</li>`;
  return `<div class="cols">
    <div class="col"><h4>Reuniones</h4><ul>${pt.meetings.map(([w, t]) => li(w, t)).join('') || '<li class="muted">Sin reuniones en el período.</li>'}</ul></div>
    <div class="col"><h4>Para tu cargo · ${P().cargo}</h4><ul>${docs.map((id) => `<li><button class="linklike" data-act="side-doc:${id}">${DOCS[id].name}</button></li>`).join('') || `<li class="muted">${inEdition ? 'Nada nuevo para tu cargo en esta edición.' : 'Nada nuevo para tu cargo.'}</li>`}</ul></div>
  </div>`;
}
const expiringItem = (d) => { const x = DOCS[d];
  return NcListItem({ icon: 'mdiClockOutline', lead: x.nodate ? 'error' : 'warning', name: x.name, sub: x.nodate ? 'La IA no encontró fecha de vigencia en el documento' : 'Vence el ' + x.expires, act: 'side-doc:' + d,
    tail: x.nodate ? NcChip('Sin fecha', 'error') : NcChip(x.days + ' días', 'warning') }); };

function pageParaTi() {
  const latest = BULLETINS.filter(receives).map((b) => [b, b.editions[0]]);
  const docIds = [...new Set(latest.flatMap(([, e]) => EDITIONS[e].docs.map(([d]) => d)))];
  const expiring = [...new Set(latest.flatMap(([, e]) => EDITIONS[e].expiring))].filter(docOk);
  const writing = BULLETINS.filter((b) => canManage(b) && b.writing);
  return contentBar('Para ti', `Semana del 23 al 29 de noviembre · ${P().name}, ${P().cargo}`) + `<div class="page">
    <div class="section">${personalCols(docIds, false)}<div class="hint">Esta parte sale directo de tu calendario y de tu cargo, sin IA.</div></div>
    ${expiring.length ? `<div class="section"><h3>Protocolos por vencer</h3><div class="list">${expiring.map(expiringItem).join('')}</div></div>` : ''}
    <div class="section"><h3>Últimas ediciones</h3><div class="list">${latest.map(([b, eid]) => { const e = EDITIONS[eid];
      return NcListItem({ icon: 'mdiNewspaperVariantOutline', lead: 'primary', name: b.name, details: e.short, sub: e.summary, act: 'edition:' + eid, tail: S.read[eid] ? '' : NcChip('Nueva', 'primary') }); }).join('')}</div></div>
    ${writing.length ? NcNoteCard('info', writing.map((b) => `<strong>${b.name}.</strong> ${b.writing}`).join('<br>'), 'En tu grupo') : ''}
  </div>`;
}

function pageBulletins() {
  return contentBar('Boletines', isEditor() ? 'Los boletines que recibes y los de tus grupos editores.' : 'Los boletines que recibes.',
    isEditor() ? NcButton('primary', 'Nuevo boletín', 'side-config:nuevo', 'mdiPlus') : '') + `<div class="page"><div class="list">${visibleBulletins().map((b) => {
      const e = EDITIONS[b.editions[0]];
      const tail = canManage(b) ? NcActions('b-' + b.id, [{ icon: 'mdiCogOutline', label: 'Configurar', act: 'side-config:' + b.id }, { icon: 'mdiHistory', label: 'Ediciones anteriores', act: 'edition:' + b.editions[b.editions.length - 1] }]) : '';
      return NcListItem({ icon: 'mdiNewspaperVariantOutline', lead: 'primary', name: b.name, details: 'Última: ' + e.short, act: 'edition:' + b.editions[0], tail, wrap: true,
        sub: `${b.schedule}${canManage(b) ? ' · Grupo ' + b.group : ''}${receives(b) ? '' : ' · No la recibes'}`, extra: b.writing && canManage(b) ? `<span class="muted">${b.writing}</span>` : '' });
    }).join('')}</div>
    ${isEditor() ? NcNoteCard('info', 'Un boletín pertenece a su grupo editor: cualquier editor del grupo lo cambia, y sigue funcionando aunque alguien se vaya.') : ''}</div>`;
}

function pageEdition(eid) {
  const e = EDITIONS[eid]; const b = bOf(e.b); const manage = canManage(b);
  if (!receives(b) && !manage) return pageBulletins();
  S.read[eid] = true;
  const correcting = S.correcting === eid;
  const summary = S.corrected[eid] || e.summary;
  const acts = manage && !S.withdrawn[eid] ? (correcting ? NcButton('tertiary', 'Cancelar', 'cancel-correct') + NcButton('primary', 'Guardar corrección', 'save-correct:' + eid, 'mdiCheck') :
    NcButton('secondary', 'Configurar', 'side-config:' + b.id, 'mdiCogOutline') + NcActions('ed-' + eid, [{ icon: 'mdiPencilOutline', label: 'Corregir el resumen', act: 'correct:' + eid }, '-', { icon: 'mdiEyeOffOutline', label: 'Retirar esta edición', act: 'withdraw:' + eid, error: true }])) : '';
  const others = b.editions.filter((x) => x !== eid);
  return contentBar(b.name, e.date, acts) + `<div class="page">
    ${S.withdrawn[eid] ? NcNoteCard('error', `Los lectores ya no la ven. ${NcButton('tertiary small', 'Deshacer', 'undo-withdraw:' + eid)}`, 'Retiraste esta edición') : ''}
    ${b.writing && manage ? NcNoteCard('info', b.writing, 'Próxima edición') : ''}
    <div class="edition-meta">${NcChip('Escrito por IA', 'primary', 'mdiCreation')}${NcChip(b.schedule)}${S.corrected[eid] ? NcChip('Corregida por ' + P().name, 'success', 'mdiCheck') : ''}<span>${e.published}</span></div>
    ${manage ? `<div class="edition-meta">${ic('mdiAccountGroupOutline', 18)} ${b.readersOk} lectores pueden abrir todos los documentos que leyó${b.readersOut ? ` · ${b.readersOut} no pueden y no la reciben` : ''}</div>` : ''}
    <div class="section"><h3>Resumen</h3>${correcting ? `<textarea class="textarea" id="correct-text" rows="6" aria-label="Corregir el resumen">${summary}</textarea>` : `<p class="prose">${summary}</p>`}</div>
    ${receives(b) ? `<div class="foryou"><div class="section-head"><h3>Para ti</h3><span class="small" style="color:var(--color-primary-element-light-text)">Solo tú ves esta parte. Sale de tu calendario y de tu cargo, sin IA.</span></div>${personalCols(e.docs.map(([d]) => d), true)}</div>`
      : NcNoteCard('info', 'No recibes este boletín, así que ves solo la parte común. Cada lector ve además su lista «Para ti».')}
    <div class="section"><h3>Documentos nuevos y cambiados</h3><div class="list">${e.docs.filter(([d]) => docOk(d)).map(([d, ch]) => { const x = DOCS[d];
      return NcListItem({ icon: fileIcon(x.type), lead: ch === 'Nuevo' ? 'success' : '', name: x.name, details: ch, sub: x.summary, wrap: true, act: 'side-doc:' + d,
        extra: `<div class="chips" style="margin-top:4px">${x.cargos.map((c) => NcChip(c)).join('')}</div>` }); }).join('')}</div></div>
    ${e.expiring.length ? `<div class="section"><div class="section-head"><h3>Protocolos por vencer</h3><span class="hint">En los próximos 30 días. La fecha la lee la IA desde cada documento.</span></div><div class="list">${e.expiring.filter(docOk).map(expiringItem).join('')}</div></div>` : ''}
    ${e.unread.length ? NcNoteCard('warning', e.unread.map((d) => `${DOCS[d].name}: escaneado, sin texto. La primera versión de «IA» no lee escaneos.`).join('<br>') + (manage ? ' El grupo editor recibió un aviso.' : ''), 'Fuentes que no se pudieron leer') : ''}
    <div class="hint">Fuentes: ${b.sources.map(([, n]) => n.replace('Carpetas de equipo/', '')).join(' · ')}</div>
    ${others.length ? `<div class="section"><h3>Ediciones anteriores</h3><div class="list">${others.map((x) => NcListItem({ icon: 'mdiHistory', name: EDITIONS[x].date, sub: EDITIONS[x].summary, act: 'edition:' + x })).join('')}</div><div class="hint">Se guardan 12 meses.</div></div>` : ''}
  </div>`;
}

function reportList(ids) {
  if (!ids.length) return `<div class="empty">${ic('mdiFileDocumentCheckOutline')}<h2>Sin revisiones</h2><div>Elige un documento para que la IA lo revise.</div></div>`;
  return `<div class="list">${ids.map((id) => { const r = REPORTS[id]; const d = DOCS[r.doc];
    return NcListItem({ icon: fileIcon(d.type), name: d.name, details: r.when, act: 'report:' + id,
      sub: r.kind === 'auto' ? 'Acción «' + ACTIONS[r.action].name + '» · ' + r.who : r.who, tail: NcChip(plural(r.findings.length, 'hallazgo', 'hallazgos'), r.findings.some((f) => f.k === 'Error') ? 'error' : 'warning') }); }).join('')}</div>`;
}

function pageReviews() {
  const p = S.pending;
  return contentBar('Revisiones', 'La IA revisa un documento y te dice qué corregir. El documento no se modifica.') + `<div class="page">
    ${p ? `<div class="list-item status-row" role="status"><span class="loading"></span><div class="body"><div class="name">${DOCS[p.doc].name}</div>
      <div class="subname">${p.stage === 'queued' ? 'En la fila del modelo. En este servidor suele tardar de 1 a 3 minutos.' : 'Leyendo el documento y escribiendo la revisión…'}</div></div></div>` : ''}
    ${(S.night || []).map((d) => `<div class="list-item status-row" role="status"><span class="lead primary">${ic('mdiClockOutline')}</span><div class="body"><div class="name">${DOCS[d].name}</div><div class="subname">${PAGES[d]} páginas: se revisa esta noche, fuera de horario. Te avisaremos cuando esté lista.</div></div></div>`).join('')}
    <div class="section"><div class="section-head"><h3>Tus revisiones</h3><span class="hint">Solo tú las ves. Se borran a los 90 días.</span></div>${reportList([...S.done, 'r1'])}</div>
    <div class="section"><div class="section-head"><h3>Revisiones automáticas</h3><span class="hint">De archivos que puedes abrir, en carpetas con una acción automática.</span></div>${reportList(['r2', 'r3'])}</div>
    ${NcNoteCard('info', 'También desde Archivos: en el menú <strong>⋯</strong> de un documento, <strong>«Revisar con IA»</strong>.')}
  </div>`;
}

function pageReport(id) {
  const r = REPORTS[id]; const d = DOCS[r.doc]; const a = r.action ? ACTIONS[r.action] : null;
  const count = (k) => r.findings.filter((f) => f.k === k).length;
  return contentBar(d.name, `${r.kind === 'manual' ? 'Revisión pedida por ti' : 'Revisión automática'} · ${r.when}`,
    NcButton('secondary', 'Abrir el documento', 'goto:files', 'mdiOpenInNew') + NcActions('rep-' + id, [{ icon: 'mdiRefresh', label: 'Revisar de nuevo', act: 'rereview:' + r.doc }]), backBtn('view:reviews')) + `<div class="page">
    <div class="chips">${NcChip('Escrito por IA', 'primary', 'mdiCreation')}${count('Error') ? NcChip(plural(count('Error'), 'error', 'errores'), 'error') : ''}${count('Falta') ? NcChip(plural(count('Falta'), 'falta', 'faltas'), 'warning') : ''}${count('Poco claro') ? NcChip(count('Poco claro') + ' poco claro', 'primary') : ''}</div>
    ${a ? NcNoteCard('info', `${r.who}. Puede leer esta revisión cualquiera que pueda abrir el archivo.${a.instructions ? `<br>Instrucciones del grupo ${a.group}: «${a.instructions}»` : ''}`, `Acción «${a.name}»`) : NcNoteCard('info', 'Solo tú ves esta revisión, mientras puedas abrir el archivo. Se borra a los 90 días.')}
    <div class="section">${r.findings.map((f) => `<div class="finding"><div class="chips">${kindChip(f.k)}<span class="small muted">${f.where}</span></div><p class="prose">${f.text}</p>
      <div class="suggestion">${ic('mdiCheckCircleOutline', 18)}<div><strong>Sugerencia:</strong> ${f.fix}</div></div></div>`).join('')}</div>
    <div class="hint">El documento no se modificó. Aplica los cambios tú en el editor.</div>
  </div>`;
}

const FILTERS = [['all', 'Todos'], ['week', 'Nuevos y cambiados'], ['expiring', 'Por vencer'], ['findings', 'Con hallazgos'], ['mine', 'Para mi cargo']];
function docsFor(f) {
  return Object.keys(DOCS).filter(docOk).filter((id) => { const d = DOCS[id];
    if (f === 'week') return d.week; if (f === 'expiring') return d.days <= 30 || d.nodate; if (f === 'findings') return !!d.review; if (f === 'mine') return forCargo(d); return true; });
}
function pageDocs() {
  const ids = docsFor(S.filter); const sel = S.side && S.side[0] === 'doc' ? S.side[1] : null;
  return contentBar('Documentos', 'De las fuentes de tus boletines y de las carpetas con acciones automáticas.') + `<div class="page wide">
    <div class="segmented" role="group" aria-label="Filtrar documentos">${FILTERS.map(([k, l]) => `<button data-act="filter:${k}" aria-pressed="${S.filter === k}">${l} <span class="tab-num muted">${docsFor(k).length}</span></button>`).join('')}</div>
    <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Lectura</th><th>Vigencia</th><th>Le concierne a</th><th>Revisión</th></tr></thead><tbody>
    ${ids.map((id) => { const d = DOCS[id]; const r = d.review ? REPORTS[d.review] : null;
      return `<tr class="row ${sel === id ? 'selected' : ''}" data-act="side-doc:${id}" tabindex="0"><td><div class="file-name"><span class="file-ic ${d.type}">${ic(fileIcon(d.type), 28)}</span><div style="min-width:0"><div class="bold">${d.name}</div><div class="small muted">${d.folder}</div></div></div></td>
        <td>${d.scan ? NcChip('Escaneado', 'warning') : `<span class="small">${d.reading}</span>`}</td>
        <td>${d.nodate ? NcChip('Sin fecha', 'error') : d.days ? NcChip(d.days + ' días', 'warning') : `<span class="small">${d.expires || '—'}</span>`}</td>
        <td><div class="chips">${d.cargos.slice(0, 2).map((c) => NcChip(c)).join('')}${d.cargos.length > 2 ? `<span class="small muted">+${d.cargos.length - 2}</span>` : ''}</div></td>
        <td>${r ? NcChip(plural(r.findings.length, 'hallazgo', 'hallazgos'), r.findings.some((x) => x.k === 'Error') ? 'error' : 'warning') : '<span class="muted">—</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="hint">La lectura de cada documento (resumen, vigencia y cargos) se hace una vez por versión, fuera de horario, y la usan todos los boletines.</div></div>`;
}

function pageActions() {
  return contentBar('Acciones automáticas', 'Cuando llega o cambia un archivo en la carpeta, «IA» lo revisa fuera de horario (22:00–06:00).', NcButton('primary', 'Nueva acción', 'side-action:nueva', 'mdiPlus')) + `<div class="page">
    <div class="list">${myActions().map(([id, a]) => NcListItem({ icon: 'mdiLightningBoltOutline', lead: a.origin === 'flow' ? 'warning' : 'primary', name: a.name, details: a.last, wrap: true,
      act: canEditAction(a) ? 'side-action:' + id : (a.origin === 'flow' && isAdmin() ? 'goto:settings:flow' : ''),
      sub: `${a.folder.replace('Carpetas de equipo/', '')} · ${a.origin === 'flow' ? 'Regla de Flujo (administración)' : 'Grupo ' + a.group} · ${a.next}`,
      extra: a.instructions ? `<span class="muted">Instrucciones: «${a.instructions}»</span>` : '',
      tail: canEditAction(a) ? NcActions('a-' + id, [{ icon: 'mdiCogOutline', label: 'Configurar', act: 'side-action:' + id }, { icon: 'mdiPauseCircleOutline', label: 'Pausar', act: 'toast:Prototipo: la acción no se pausa.' }]) : '' })).join('')}</div>
    ${NcNoteCard('info', 'Quien sube o cambia el archivo recibe un aviso, y cualquiera que pueda abrir el archivo puede leer su revisión. Si un archivo cambia varias veces en el día, esa noche se revisa una vez su última versión.')}
  </div>`;
}

/* ---------- «IA»: sidebars ---------- */
function sidebar(title, sub, tabs, body, foot = '', actions = '') {
  return `<aside class="app-sidebar" aria-label="${title}"><div class="sidebar-header"><div class="titles"><h2>${title}</h2>${sub ? `<div class="small muted">${sub}</div>` : ''}</div>${actions}${NcButton('tertiary', '', 'close-side', 'mdiClose', 'Cerrar la barra lateral')}</div>
    ${tabs ? `<div class="sidebar-tabs" role="tablist">${tabs.map(([k, l, i]) => `<button class="sidebar-tab" role="tab" aria-selected="${S.tab === k}" data-act="tab:${k}">${ic(i)}<span>${l}</span></button>`).join('')}</div>` : ''}
    <div class="sidebar-body">${body}</div>${foot ? `<div class="sidebar-foot">${foot}</div>` : ''}</aside>`;
}
const radio = (current, value, label, hint = '') => { const on = current === value;
  return `<button class="radio" role="radio" aria-checked="${on}" data-act="sched:${value}">${ic(on ? 'mdiRadioboxMarked' : 'mdiRadioboxBlank')}<span class="lbl"><strong>${label}</strong>${hint ? `<br><span class="hint">${hint}</span>` : ''}</span></button>`; };

function sideConfig(id) {
  const isNew = id === 'nuevo';
  const b = isNew ? { name: '', group: P().groups.find((g) => EDITOR_GROUPS.includes(g)), readers: [], sources: [], sched: 'semanal', readersOk: 0, readersOut: 0 } : bOf(id);
  const tab = S.tab || 'fuentes'; const sched = S.sched[id] || b.sched;
  let body;
  if (tab === 'fuentes') {
    body = `${isNew ? `<div class="field"><label class="field-label" for="b-name">Nombre</label><input class="input" id="b-name" placeholder="Por ejemplo: Boletín del sector Verde"></div>` : ''}
      <div class="field"><span class="field-label">Grupo editor</span><div class="chips">${NcChip(b.group, 'primary', 'mdiAccountGroupOutline')}</div><span class="hint">Cualquier editor del grupo lo cambia. Sigue funcionando aunque alguien se vaya.</span></div>
      <div class="field"><span class="field-label">Fuentes</span>
        ${b.sources.length ? `<div>${b.sources.map(([t, n]) => `<div class="source-row">${ic(t === 'calendar' ? 'mdiCalendarOutline' : 'mdiFolderOutline')}<span class="grow">${n}</span>${NcButton('tertiary', '', 'toast:Prototipo: no se quita nada.', 'mdiClose', 'Quitar ' + n)}</div>`).join('')}</div>` : '<div class="hint">Sin fuentes todavía.</div>'}
        <div>${NcButton('secondary', 'Agregar carpeta, documento o calendario', 'open-picker:source', 'mdiPlus')}</div>
        <span class="hint">Solo fuentes que todo el grupo ${b.group} puede abrir.</span></div>
      ${b.writing ? NcNoteCard('info', b.writing, 'Próxima edición') : ''}
      ${NcNoteCard('info', 'Cada edición cubre todas las fuentes; los documentos que no cambiaron reutilizan su lectura. Si no cabe en una noche, sigue la noche siguiente y se publica al terminar; si pasa su fecha, aparece como «atrasada».')}`;
  } else if (tab === 'horario') {
    body = `<div class="field" role="radiogroup" aria-label="Cada cuánto"><span class="field-label">Cada cuánto</span>
      ${radio(sched, 'diaria', 'Diaria')}${radio(sched, 'semanal', 'Semanal', 'Los lunes')}${radio(sched, 'mensual', 'Mensual', 'El día 1')}${radio(sched, 'cambios', 'Cuando cambian sus fuentes', 'Se revisa cada noche; si nada cambió, no hay edición.')}</div>
      ${NcNoteCard('info', 'La IA la escribe fuera de horario (22:00–06:00) y se publica al terminar, sin aprobación y marcada como escrita por IA. Si el servidor estaba apagado, se escribe una sola vez la noche siguiente.')}
      <div class="hint">Las listas cubren el período del boletín: mañana si es diario, la semana que viene si es semanal, el mes que viene si es mensual. «Por vencer» son los próximos 30 días.</div>`;
  } else {
    body = `<div class="field"><span class="field-label">Grupos lectores</span><div class="chips">${b.readers.map((r) => NcChip(r, '', 'mdiAccountGroupOutline')).join('') || '<span class="hint">Sin lectores todavía.</span>'}</div>
      <input class="input" id="b-readers" placeholder="Agregar un grupo" aria-label="Agregar un grupo lector"></div>
      ${b.readersOk ? NcNoteCard(b.readersOut ? 'warning' : 'success', b.readersOut ? `${b.readersOut} personas de esos grupos no pueden abrir algún documento que la edición leyó, y no la recibirán: así el resumen no muestra lo que no pueden ver.` : 'Todos los lectores pueden abrir todo lo que la edición lee.', `${b.readersOk} personas recibirán cada edición`) : ''}
      ${b.readersOut ? `<div class="field"><span class="field-label">No la reciben</span><div class="list">${NcListItem({ icon: 'mdiAccountOutline', name: 'Laura Díaz', sub: 'No puede abrir Calidad/Circulares' })}${NcListItem({ icon: 'mdiAccountMultipleOutline', name: 'Camila Fuentes y 2 más', sub: 'No pueden abrir el calendario Reuniones CESFAM' })}</div></div>` : ''}
      <div class="hint">Cada lector recibe un aviso de Nextcloud y ve la edición en «IA» y en su Panel.</div>`;
  }
  return sidebar(isNew ? 'Nuevo boletín' : b.name, isNew ? 'Boletín' : 'Configuración del boletín', [['fuentes', 'Fuentes', 'mdiFolderOutline'], ['horario', 'Horario', 'mdiCalendarClock'], ['lectores', 'Lectores', 'mdiAccountGroupOutline']], body,
    NcButton('tertiary', 'Cancelar', 'close-side') + NcButton('primary', 'Guardar', 'save'));
}

function sideAction(id) {
  const isNew = id === 'nueva';
  const a = isNew ? { name: '', folder: '', group: P().groups.find((g) => EDITOR_GROUPS.includes(g)), instructions: '' } : ACTIONS[id];
  const groups = P().groups.filter((g) => EDITOR_GROUPS.includes(g));
  const body = `<div class="field"><label class="field-label" for="a-name">Nombre</label><input class="input" id="a-name" value="${a.name}" placeholder="Por ejemplo: Protocolos en borrador"></div>
    <div class="field"><span class="field-label">Carpeta</span>${a.folder ? `<div class="source-row">${ic('mdiFolderOutline')}<span class="grow">${a.folder}</span></div>` : ''}
      <div>${NcButton('secondary', a.folder ? 'Cambiar carpeta' : 'Elegir carpeta', 'open-picker:folder', 'mdiFolderOutline')}</div><span class="hint">Una carpeta que todo el grupo puede abrir.</span></div>
    <div class="field"><span class="field-label">Qué hace</span><div>Revisa los archivos nuevos, los que cambian y los que se mueven o copian a la carpeta, fuera de horario.</div></div>
    <div class="field"><label class="field-label" for="a-instr">Instrucciones del grupo <span class="muted">(opcional)</span></label><textarea class="textarea" id="a-instr" placeholder="Por ejemplo: revisa que tenga fecha de vigencia y responsables.">${a.instructions}</textarea><span class="hint">Se suman a la revisión normal.</span></div>
    <div class="field"><label class="field-label" for="a-group">Grupo editor</label><select class="select" id="a-group">${groups.map((g) => `<option ${g === a.group ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
    ${NcNoteCard('info', 'Quien sube o cambia un archivo recibe un aviso cuando su revisión está lista. Los administradores también pueden crear esta acción como regla en Flujo de Nextcloud.')}`;
  return sidebar(isNew ? 'Nueva acción automática' : a.name, 'Acción automática', null, body, NcButton('tertiary', 'Cancelar', 'close-side') + NcButton('primary', 'Guardar', 'save'));
}

function sideDoc(id) {
  const d = DOCS[id]; const tab = S.tab || 'lectura';
  let body;
  if (tab === 'lectura') {
    body = d.scan ? NcNoteCard('warning', 'Escaneado, sin texto. La primera versión de «IA» no lee escaneos.') :
      `<div class="hint">Lo que la IA sacó una vez de la versión actual. Se reutiliza hasta que el documento cambie.</div>
       <dl class="kv"><dt>Resumen</dt><dd>${d.summary}</dd>
       <dt>Vigencia</dt><dd>${d.nodate ? NcChip('No encontró fecha de vigencia', 'error') : (d.expires || '—') + (d.days ? ' ' + NcChip(d.days + ' días', 'warning') : '')}</dd>
       <dt>Le concierne a</dt><dd><div class="chips">${d.cargos.map((c) => NcChip(c)).join('')}</div></dd>
       <dt>Lectura</dt><dd>${d.reading}</dd><dt>Carpeta</dt><dd>${d.folder}</dd></dl>`;
  } else if (tab === 'revision') {
    const r = d.review ? REPORTS[d.review] : null;
    body = r ? `<div class="hint">${r.kind === 'auto' ? 'Revisión automática' : 'Tu revisión'} · ${r.when}</div>
      <div>${r.findings.map((f) => `<div class="finding"><div class="chips">${kindChip(f.k)}<span class="small muted">${f.where}</span></div><div class="small">${f.text}</div></div>`).join('')}</div>
      <div>${NcButton('secondary', 'Ver la revisión completa', 'report:' + d.review)}</div>`
      : `<div class="empty" style="padding:24px 8px">${ic('mdiFileDocumentCheckOutline')}<h2>Sin revisión</h2><div>Este documento no está en una carpeta con acción automática.</div></div><div>${NcButton('primary', 'Revisar ahora', 'rereview:' + id, 'mdiCreation')}</div>`;
  } else {
    const ins = Object.entries(EDITIONS).filter(([, e]) => e.docs.some(([x]) => x === id) || e.expiring.includes(id)).filter(([, e]) => { const b = bOf(e.b); return receives(b) || canManage(b); });
    body = ins.length ? `<div class="list">${ins.map(([eid, e]) => NcListItem({ icon: 'mdiNewspaperVariantOutline', lead: 'primary', name: bOf(e.b).name, sub: e.date, act: 'edition:' + eid })).join('')}</div>` : '<div class="hint">No aparece en ningún boletín que puedas ver.</div>';
  }
  return sidebar(d.name, `${d.folder} · ${d.size} · modificado ${d.mod}`, [['lectura', 'Lectura', 'mdiCreation'], ['revision', 'Revisión', 'mdiFileDocumentCheckOutline'], ['aparece', 'Aparece en', 'mdiNewspaperVariantOutline']], body, '',
    NcButton('tertiary', '', 'goto:files', 'mdiOpenInNew', 'Abrir en Archivos'));
}

function renderSidebar() {
  if (!S.side) return '';
  const [t, id] = S.side;
  return t === 'config' ? sideConfig(id) : t === 'action' ? sideAction(id) : sideDoc(id);
}

function screenIA() {
  const v = S.view; let page;
  if (v.s === 'bulletins') page = pageBulletins();
  else if (v.s === 'edition') page = pageEdition(v.e);
  else if (v.s === 'reviews') page = pageReviews();
  else if (v.s === 'report') page = pageReport(v.r);
  else if (v.s === 'docs' && isEditor()) page = pageDocs();
  else if (v.s === 'actions' && isEditor()) page = pageActions();
  else page = pageParaTi();
  return iaNavigation() + `<section class="app-content">${page}</section>` + renderSidebar();
}

    <div class="header-right">
      <button class="header-btn hide-sm" data-act="toast:Búsqueda unificada de Nextcloud." aria-label="Buscar">${ic('mdiMagnify', 22)}</button>
      <span class="pop-anchor" data-keep><button class="header-btn" data-act="pop:notif" aria-expanded="${S.pop === 'notif'}" aria-label="Notificaciones" style="position:relative">${ic('mdiBellOutline', 22)}${notes.length ? '<span class="header-dot"></span>' : ''}</button>
        ${S.pop === 'notif' ? `<div class="popover notif-panel" role="dialog" aria-label="Notificaciones"><div class="notif-head"><strong>Notificaciones</strong>${NcButton('tertiary small', 'Descartar todas', 'toast:Prototipo: los avisos no se descartan.')}</div>
          ${notes.map((x) => `<div class="notif">${ic(x.icon)}<div style="flex:1;min-width:0"><div class="bold">${x.title}</div><div class="small muted">${x.body}</div><div class="inline" style="margin-top:6px">${NcButton('primary small', x.btn, x.act)}<span class="small muted">${x.time}</span></div></div></div>`).join('')}</div>` : ''}</span>
      <button class="header-btn hide-sm" data-act="toast:Contactos de Nextcloud." aria-label="Contactos">${ic('mdiAccountMultipleOutline', 22)}</button>
      <span class="pop-anchor" data-keep><button class="header-btn" data-act="pop:user" aria-expanded="${S.pop === 'user'}" aria-label="Menú de ${P().name}"><span class="avatar">${P().initials}</span></button>
        ${S.pop === 'user' ? `<div class="popover" role="menu" style="right:0;top:46px"><div style="padding:8px 12px"><div class="bold">${P().name}</div><div class="small muted">${P().cargo}</div></div><div class="menu-sep"></div>
          <button class="menu-item" data-act="goto:dashboard">${ic('mdiViewDashboardOutline')}Panel</button>${isAdmin() ? `<button class="menu-item" data-act="goto:settings:ia">${ic('mdiCogOutline')}Configuración de administración</button>` : `<button class="menu-item" data-act="toast:Configuración personal de Nextcloud.">${ic('mdiCogOutline')}Configuración</button>`}
          <div class="menu-sep"></div><button class="menu-item" data-act="toast:Prototipo.">${ic('mdiLogout')}Cerrar sesión</button></div>` : ''}</span>
    </div>`;
}

function renderPicker() {
  if (!S.modal) return '';
  const target = S.modal.split(':')[1];
  const title = target === 'source' ? 'Agregar fuente' : target === 'folder' ? 'Elegir carpeta' : 'Elegir un documento';
  const ids = FILES_FOLDER.filter((id) => !DOCS[id].scan);
  return `<div class="modal-mask" data-act="close-modal"><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}" data-inside>
    <div class="dialog-head"><h2>${title}</h2>${NcButton('tertiary', '', 'close-modal', 'mdiClose', 'Cerrar')}</div>
    <div class="dialog-main"><div class="dialog-nav">${navEntry('noop', 'Todos los archivos', 'mdiFolderOutline', true)}${navEntry('noop', 'Recientes', 'mdiHistory', false)}${navEntry('noop', 'Favoritos', 'mdiStarOutline', false)}${target === 'source' ? navEntry('noop', 'Calendarios', 'mdiCalendarOutline', false) : ''}</div>
      <div class="dialog-content"><div class="breadcrumbs"><span class="crumb">${ic('mdiFolderAccountOutline', 18)}</span><span class="sep">›</span><span class="crumb">Carpetas de equipo</span><span class="sep">›</span><span class="crumb">Protocolos</span></div>
        <input class="input" placeholder="Filtrar la lista de archivos" aria-label="Filtrar">
        <div class="list" style="margin-top:8px">${target !== 'doc' ? NcListItem({ icon: 'mdiFolder', name: 'Protocolos', sub: 'Carpeta de equipo · todo el grupo puede abrirla', act: 'pick-folder' }) : ''}
          ${target === 'folder' ? '' : ids.map((id) => NcListItem({ icon: fileIcon(DOCS[id].type), name: DOCS[id].name, sub: `${PAGES[id] || 1} páginas · ${DOCS[id].size} · ${DOCS[id].mod}`, act: target === 'doc' ? 'pick:' + id : 'pick-folder' })).join('')}</div>
        <div class="hint" style="margin-top:8px">«IA» lee PDF con texto, DOCX, ODT, TXT y MD. Hasta unas ${DAY_PAGES} páginas se revisan al momento; los más largos, esta noche.</div></div></div>
    <div class="dialog-foot">${NcButton('tertiary', 'Cancelar', 'close-modal')}${NcButton('primary', target === 'doc' ? 'Revisar' : 'Elegir', target === 'doc' ? 'pick:hta' : 'pick-folder')}</div></div></div>`;
}

function renderBar() {
  const screens = [['ia', '«IA»'], ['files', 'Archivos'], ['dashboard', 'Panel'], ['settings', 'Administración']].filter(([k]) => k !== 'settings' || isAdmin());
  return `<span class="pb-tag">Prototipo · datos de ejemplo</span><span>Ver como</span>
    <span class="pb-seg">${Object.entries(PEOPLE).map(([k, p]) => `<button data-act="role:${k}" aria-pressed="${S.role === k}">${p.label}</button>`).join('')}</span>
    <span class="hide-sm">Ir a</span><span class="pb-seg">${screens.map(([k, l]) => `<button data-act="goto:${k}${k === 'settings' ? ':ia' : ''}" aria-pressed="${S.screen === k}">${l}</button>`).join('')}</span>`;
}

function render() {
  document.getElementById('header').innerHTML = renderHeader();
  document.getElementById('content').innerHTML = S.screen === 'ia' ? screenIA() : S.screen === 'files' ? screenFiles() : S.screen === 'dashboard' ? screenDashboard() : screenSettings();
  document.getElementById('layer').innerHTML = renderPicker();
  document.getElementById('protobar').innerHTML = renderBar();
}

let toastTimer;
function toast(msg, action = '') {
  document.querySelectorAll('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${msg}</span>${action}`; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4200);
}

/* ---------- behaviour ---------- */
function startReview(doc, fromFiles = false) {
  S.modal = null;
  if ((PAGES[doc] || 1) > DAY_PAGES) {
    S.night = [...(S.night || []).filter((x) => x !== doc), doc];
    if (!fromFiles) { S.screen = 'ia'; S.view = { s: 'reviews' }; S.side = null; }
    render(); toast(`Tiene ${PAGES[doc]} páginas: se revisará esta noche, desde las 22:00. Te avisaremos cuando esté lista.`); return;
  }
  S.pending = { doc, stage: 'queued' };
  if (!fromFiles) { S.screen = 'ia'; S.view = { s: 'reviews' }; S.side = null; }
  render();
  if (fromFiles) toast('Revisión pedida. Te avisaremos cuando esté lista.', NcButton('secondary small', 'Ver en «IA»', 'goto:ia:reviews'));
  setTimeout(() => { if (S.pending) { S.pending.stage = 'working'; render(); } }, 1500);
  setTimeout(() => {
    if (!S.pending) return;
    const id = 'n' + (S.done.length + 1);
    REPORTS[id] = doc === 'hta' ? { ...REPORTS.r1, when: 'Hace un momento' } : { doc, kind: 'manual', who: 'Pedida por ti', when: 'Hace un momento', findings: [
      { k: 'Falta', where: 'Portada', text: 'No indica fecha de vigencia ni de próxima revisión.', fix: 'Agregar la vigencia en la portada.' },
      { k: 'Poco claro', where: 'Sección 3', text: 'Usa «según corresponda» sin decir quién decide.', fix: 'Nombrar el cargo responsable de esa decisión.' } ] };
    S.done.unshift(id); S.pending = null;
    const onReviews = S.screen === 'ia' && S.view.s === 'reviews';
    if (onReviews) S.view = { s: 'report', r: id };
    render(); toast('Tu revisión está lista.', onReviews ? '' : NcButton('secondary small', 'Ver', 'goto:ia:report:' + id));
  }, 3800);
}

function go(arg) {
  const [screen, s, x] = arg.split(':');
  S.screen = screen; S.side = null; S.pop = null; S.navOpen = false; S.correcting = null;
  if (screen === 'ia' && s) S.view = s === 'edition' ? { s, e: x } : s === 'report' ? { s, r: x } : { s };
  if (screen === 'settings') S.settings = s || 'ia';
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (el && el.classList.contains('modal-mask') && ev.target.closest('[data-inside]')) return;
  if (!el) { if (S.pop && !ev.target.closest('[data-keep]')) { S.pop = null; render(); } return; }
  const [act, ...rest] = el.dataset.act.split(':'); const arg = rest.join(':');
  if (act !== 'pop') S.pop = null;
  switch (act) {
    case 'noop': return;
    case 'view': S.view = { s: arg }; S.side = null; S.correcting = null; S.navOpen = false; break;
    case 'edition': S.screen = 'ia'; S.view = { s: 'edition', e: arg }; S.side = null; S.correcting = null; S.navOpen = false; break;
    case 'report': S.screen = 'ia'; S.view = { s: 'report', r: arg }; S.side = null; S.navOpen = false; break;
    case 'filter': S.filter = arg; break;
    case 'goto': go(arg); break;
    case 'settings': S.settings = arg; S.navOpen = false; break;
    case 'pop': S.pop = S.pop === arg ? null : arg; break;
    case 'side-config': S.side = ['config', arg]; S.tab = 'fuentes'; break;
    case 'side-action': S.side = ['action', arg]; S.tab = null; break;
    case 'side-doc': S.side = ['doc', arg]; S.tab = 'lectura'; break;
    case 'tab': S.tab = arg; break;
    case 'sched': if (S.side) S.sched[S.side[1]] = arg; break;
    case 'close-side': S.side = null; break;
    case 'open-picker': S.modal = 'picker:' + (arg || 'doc'); break;
    case 'close-modal': S.modal = null; break;
    case 'pick': startReview(arg); return;
    case 'pick-folder': S.modal = null; toast('Prototipo: la fuente quedaría agregada.'); break;
    case 'rereview': startReview(arg); return;
    case 'files-review': startReview(arg, true); return;
    case 'correct': S.correcting = arg; break;
    case 'cancel-correct': S.correcting = null; break;
    case 'save-correct': { const t = document.getElementById('correct-text'); if (t) S.corrected[arg] = t.value; S.correcting = null; toast('Corrección guardada. Los lectores ven el texto corregido.'); break; }
    case 'withdraw': S.withdrawn[arg] = true; toast('Edición retirada.'); break;
    case 'undo-withdraw': delete S.withdrawn[arg]; break;
    case 'retry': S.retried[arg] = true; toast('Reintento programado para la próxima noche.'); break;
    case 'save': S.side = null; toast('Guardado. (Prototipo: no se guarda nada.)'); break;
    case 'toggle-nav': if (window.matchMedia('(max-width: 800px)').matches) S.navOpen = !S.navOpen; else S.navCollapsed = !S.navCollapsed; break;
    case 'role': S.role = arg; S.side = null; S.correcting = null;
      if (S.screen === 'settings' && !isAdmin()) go('ia:parati');
      if (S.screen === 'ia' && S.view.s === 'edition') { const b = bOf(EDITIONS[S.view.e].b); if (!receives(b) && !canManage(b)) S.view = { s: 'parati' }; }
      break;
    case 'toast': toast(arg); return;
    default: return;
  }
  render();
});
document.addEventListener('keydown', (ev) => {
  const a = document.activeElement;
  if (ev.key === 'Escape') { S.side = null; S.modal = null; S.pop = null; render(); return; }
  if ((ev.key === 'Enter' || ev.key === ' ') && a && a.matches('[role=button][data-act], tr[data-act]')) { ev.preventDefault(); a.click(); }
});

render();
</script>
